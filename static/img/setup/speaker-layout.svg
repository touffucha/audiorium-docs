<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="705" viewBox="0 0 720 470" font-family="'Jost','Irohamaru','Hiragino Sans','Yu Gothic UI',sans-serif">
  <!-- 真上から見た Add Audiorium の直後の配置。値は製品の AudioriumArrangements：視聴位置からスクリーンまでを D（スクリーンの幅 × 0.78）として、
       Front は左右 0.56D・スクリーンの手前、Surround は左右 0.66D・視聴位置の 0.24D 後ろ、Top Middle は左右 0.37D・視聴位置の真横の天井、
       Stereo Mix と Subwoofer は動画プレイヤーの音源の位置、コンソールは視聴位置からスクリーン側へ 0.9 m（D = 4 m の縮尺）。図では D = 220 -->
  <g stroke="#b9b9b9" stroke-width="1" stroke-dasharray="4 4">
    <line x1="360" y1="304" x2="237" y2="104"/>
    <line x1="360" y1="304" x2="483" y2="104"/>
    <line x1="360" y1="304" x2="215" y2="357"/>
    <line x1="360" y1="304" x2="505" y2="357"/>
  </g>

  <rect x="219" y="80" width="282" height="8" fill="#2a2a2a"/>
  <text x="360" y="68" font-size="13" fill="#6b6b6b" text-anchor="middle">スクリーン（動画プレイヤー）</text>

  <rect x="228" y="95" width="18" height="18" fill="#2a2a2a"/>
  <rect x="474" y="95" width="18" height="18" fill="#2a2a2a"/>
  <text x="220" y="109" font-size="15" fill="#2a2a2a" text-anchor="end">Front</text>
  <text x="500" y="109" font-size="15" fill="#2a2a2a">Front</text>

  <circle cx="348" cy="104" r="7" fill="#8a8a8a"/>
  <rect x="362" y="98" width="22" height="12" rx="4" fill="#8a8a8a"/>
  <text x="336" y="129" font-size="15" fill="#2a2a2a" text-anchor="end">Stereo Mix</text>
  <text x="378" y="129" font-size="15" fill="#2a2a2a">Subwoofer</text>

  <rect x="330" y="247" width="60" height="14" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="360" y="240" font-size="13" fill="#6b6b6b" text-anchor="middle">コンソール</text>

  <rect x="270" y="295" width="18" height="18" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="3 2"/>
  <rect x="432" y="295" width="18" height="18" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="279" y="286" font-size="15" fill="#2a2a2a" text-anchor="middle">Top Middle</text>
  <text x="441" y="286" font-size="15" fill="#2a2a2a" text-anchor="middle">Top Middle</text>

  <circle cx="360" cy="304" r="12" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="360" cy="304" r="4" fill="#2a2a2a"/>
  <text x="360" y="336" font-size="15" fill="#2a2a2a" text-anchor="middle">視聴位置</text>

  <rect x="206" y="348" width="18" height="18" fill="#2a2a2a"/>
  <rect x="496" y="348" width="18" height="18" fill="#2a2a2a"/>
  <text x="198" y="362" font-size="15" fill="#2a2a2a" text-anchor="end">Surround</text>
  <text x="522" y="362" font-size="15" fill="#2a2a2a">Surround</text>

  <g font-size="13" fill="#6b6b6b">
    <rect x="130" y="404" width="12" height="12" fill="#2a2a2a"/>
    <text x="150" y="415">床から約 1.9 m</text>
    <rect x="276" y="404" width="12" height="12" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="296" y="415">天井</text>
    <circle cx="378" cy="410" r="6" fill="#8a8a8a"/>
    <rect x="388" y="404" width="20" height="12" rx="4" fill="#8a8a8a"/>
    <text x="416" y="415">動画プレイヤーの音源の位置</text>
  </g>
</svg>
