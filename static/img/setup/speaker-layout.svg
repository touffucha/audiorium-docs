<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="705" viewBox="0 0 720 470" font-family="'Jost','Irohamaru','Hiragino Sans','Yu Gothic UI',sans-serif">
  <!-- 真上から見た Add Audiorium の直後の配置。角度と距離は製品の AudioriumArrangements（Front 30° × 1.12、Surround 110° × 0.7、Top Middle 90° × 0.37、視聴位置からスクリーンまでを 1 とする） -->
  <g stroke="#b9b9b9" stroke-width="1" stroke-dasharray="4 4">
    <line x1="360" y1="330" x2="242" y2="126"/>
    <line x1="360" y1="330" x2="478" y2="126"/>
    <line x1="360" y1="330" x2="222" y2="380"/>
    <line x1="360" y1="330" x2="498" y2="380"/>
  </g>

  <rect x="200" y="96" width="320" height="8" fill="#2a2a2a"/>
  <text x="360" y="82" font-size="13" fill="#6b6b6b" text-anchor="middle">スクリーン（動画プレイヤー）</text>

  <g stroke="#f7f7f6" stroke-width="5" paint-order="stroke">
    <circle cx="346" cy="168" r="8" fill="#8a8a8a" stroke="none"/>
    <text x="362" y="173" font-size="15" fill="#2a2a2a">Stereo Mix</text>
    <rect x="338" y="188" width="16" height="16" fill="#8a8a8a" stroke="none"/>
    <text x="362" y="201" font-size="15" fill="#2a2a2a">Subwoofer</text>
  </g>

  <rect x="233" y="117" width="18" height="18" fill="#2a2a2a"/>
  <rect x="469" y="117" width="18" height="18" fill="#2a2a2a"/>
  <text x="224" y="131" font-size="15" fill="#2a2a2a" text-anchor="end">Front</text>
  <text x="496" y="131" font-size="15" fill="#2a2a2a">Front</text>

  <rect x="213" y="371" width="18" height="18" fill="#2a2a2a"/>
  <rect x="489" y="371" width="18" height="18" fill="#2a2a2a"/>
  <text x="204" y="385" font-size="15" fill="#2a2a2a" text-anchor="end">Surround</text>
  <text x="516" y="385" font-size="15" fill="#2a2a2a">Surround</text>

  <rect x="273" y="321" width="18" height="18" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="3 2"/>
  <rect x="429" y="321" width="18" height="18" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="282" y="362" font-size="15" fill="#2a2a2a" text-anchor="middle">Top Middle</text>
  <text x="438" y="362" font-size="15" fill="#2a2a2a" text-anchor="middle">Top Middle</text>

  <circle cx="360" cy="330" r="12" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="360" cy="330" r="4" fill="#2a2a2a"/>
  <text x="360" y="362" font-size="15" fill="#2a2a2a" text-anchor="middle">視聴位置</text>

  <g font-size="13" fill="#6b6b6b">
    <rect x="150" y="430" width="12" height="12" fill="#2a2a2a"/>
    <text x="170" y="441">床から約 1.9 m</text>
    <rect x="300" y="430" width="12" height="12" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="320" y="441">天井</text>
    <circle cx="396" cy="436" r="6" fill="#8a8a8a"/>
    <rect x="406" y="430" width="12" height="12" fill="#8a8a8a"/>
    <text x="426" y="441">動画プレイヤーの位置</text>
  </g>
</svg>
